<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bornes de recharge — Autoroutes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Top-left control panel -->
  <div id="panel">
    <div class="panel-title">Bornes rapides ≥ 150 kW</div>
    <div class="panel-sub"></div>

    <!-- Route planning -->
    <div id="route-section">
      <div class="route-label">Itinéraire</div>
      <input id="route-start" class="route-input" type="text" placeholder="Départ" autocomplete="off" />
      <input id="route-end"   class="route-input" type="text" placeholder="Arrivée" autocomplete="off" />
      <div class="route-actions">
        <button id="route-go"    class="route-btn">Calculer →</button>
        <button id="route-clear" class="route-btn route-btn-clear" style="display:none">✕ Effacer</button>
      </div>
      <div id="route-info"></div>
    </div>
  </div>

  <!-- Bottom-right legend -->
  <div id="legend">
    <div class="legend-title">Opérateurs</div>
    <div id="legend-items"></div>
    <div class="legend-hint">Taille du cercle = puissance max</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
