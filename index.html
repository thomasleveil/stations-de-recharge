<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bornes de recharge — Autoroutes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Top-left control panel -->
  <div id="panel">
    <div class="panel-title" id="panel-title">Bornes rapides ≥ 150 kW<span class="panel-chevron">▸</span></div>
    <div class="panel-sub"></div>

    <!-- Route planning -->
    <div id="route-section">
      <div class="route-label">Itinéraire</div>
      <div class="autocomplete-wrap">
        <input id="route-start" class="route-input" type="text" placeholder="Départ" autocomplete="off" />
      </div>
      <div class="autocomplete-wrap">
        <input id="route-end" class="route-input" type="text" placeholder="Arrivée" autocomplete="off" />
      </div>
      <div class="route-actions">
        <button id="route-go"    class="route-btn">Calculer →</button>
        <button id="route-clear" class="route-btn route-btn-clear" style="display:none">✕ Effacer</button>
      </div>
      <div id="corridor-row">
        <span id="corridor-label">Corridor : <strong id="corridor-value">200 m</strong></span>
        <input type="range" id="corridor-slider" min="2" max="10" step="1" value="2" style="display:none" />
      </div>
      <div id="route-info"></div>
    </div>
  </div>

  <!-- Top-right settings -->
  <div id="settings-btn" title="Paramètres">⚙</div>
  <div id="settings-menu" style="display:none">
    <div class="settings-section-label">Fond aérien (zoom ≥ 18)</div>
    <label class="settings-radio-item">
      <input type="radio" name="aerial-src" value="esri" />
      <span>Esri World Imagery</span>
    </label>
    <label class="settings-radio-item">
      <input type="radio" name="aerial-src" value="ign" />
      <span>IGN Géoportail</span>
    </label>
    <hr class="settings-divider" />
    <button id="cache-bust-btn" class="settings-item">🗑 Vider le cache</button>
  </div>

  <!-- Bottom-right legend -->
  <div id="legend">
    <div class="legend-title" id="legend-toggle">Opérateurs <span class="legend-chevron">▾</span></div>
    <div id="legend-items"></div>
    <div class="legend-hint">Taille du cercle = nb bornes CCS rapides</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
