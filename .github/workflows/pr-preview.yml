name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy PR preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Prepare app files
        run: |
          mkdir dist
          cp index.html app.js style.css filter-worker.js dist/

      - name: Deploy to gh-pages (pr/${{ github.event.pull_request.number }}/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: pr/${{ github.event.pull_request.number }}
          keep_files: true   # preserve other PR previews and main site

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.sha.slice(0, 7);
            const url = `https://thomasleveil.github.io/stations-de-recharge/pr/${prNumber}/`;
            const body = [
              '## 🔍 Prévisualisation disponible',
              '',
              `**URL :** ${url}`,
              '',
              `> Déployé depuis \`${sha}\` — se met à jour à chaque push sur cette PR.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Prévisualisation disponible')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    name: Remove PR preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove pr/${{ github.event.pull_request.number }}/ and redeploy
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          if [ -d "pr/${PR_NUM}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "pr/${PR_NUM}"
            git commit -m "chore: remove preview for PR #${PR_NUM}"
            git push
          else
            echo "No preview directory for PR #${PR_NUM}, nothing to clean up."
          fi
