<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bornes de recharge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Top-left control panel -->
  <div id="panel">
    <div class="panel-title" id="panel-title">Bornes rapides ≥ 150 kW<span class="panel-chevron">▸</span></div>
    <div class="panel-sub"></div>

    <!-- Route planning -->
    <div id="route-section">
      <div class="route-label">Itinéraire</div>
      <div class="autocomplete-wrap">
        <input id="route-start" class="route-input" type="text" placeholder="Départ" autocomplete="off" />
      </div>
      <div class="autocomplete-wrap">
        <input id="route-end" class="route-input" type="text" placeholder="Arrivée" autocomplete="off" />
      </div>
      <div class="route-actions">
        <button id="route-go"       class="route-btn">Calculer →</button>
        <button id="route-clear"    class="route-btn route-btn-clear" style="display:none">✕ Effacer</button>
        <button id="route-share"    class="route-btn route-btn-share" style="display:none" title="Copier le lien de partage">⎘</button>
        <button id="drive-mode-btn" class="route-btn route-btn-drive" style="display:none" title="Mode conduite">⬆</button>
      </div>
      <div id="corridor-row">
        <span id="corridor-label">Corridor : <strong id="corridor-value">200 m</strong></span>
        <input type="range" id="corridor-slider" min="2" max="30" step="1" value="2" style="display:none" />
      </div>
      <div id="route-info"></div>
      <div id="route-results" style="display:none">
        <div class="route-results-header" id="route-results-toggle">
          <span id="route-results-title">Stations</span>
          <span class="route-results-chevron">▸</span>
        </div>
        <div id="route-results-list"></div>
      </div>
    </div>
  </div>

  <!-- Drive mode bottom panel (U-7) -->
  <div id="drive-panel" style="display:none">
    <div class="dm-header">
      <span class="dm-title">Mode conduite</span>
      <button class="dm-exit" id="dm-exit">✕</button>
    </div>
    <div id="dm-cards"></div>
  </div>

  <!-- Top-right settings -->
  <div id="settings-btn" title="Paramètres">⚙</div>
  <div id="settings-menu" style="display:none">
    <div class="settings-section-label">Fond aérien (zoom ≥ 18)</div>
    <label class="settings-radio-item">
      <input type="radio" name="aerial-src" value="esri" />
      <span>Esri World Imagery</span>
    </label>
    <label class="settings-radio-item">
      <input type="radio" name="aerial-src" value="ign" />
      <span>IGN Géoportail</span>
    </label>
    <hr class="settings-divider" />
    <div class="settings-section-label">
      Disponibilité temps réel
      <a href="https://developer.tomtom.com" target="_blank" rel="noopener" class="settings-api-help" title="Obtenir une clé gratuite TomTom">?</a>
    </div>
    <div class="settings-api-row">
      <input type="password" id="tomtom-key-input" class="settings-api-input"
             placeholder="Clé API TomTom" autocomplete="off" spellcheck="false" />
    </div>
    <hr class="settings-divider" />
    <div class="settings-section-label">
      Mes réseaux préférés
      <span class="settings-api-help" title="Les stations de ces réseaux seront mises en avant (bordure or) quand un itinéraire est actif">?</span>
    </div>
    <div id="preferred-networks-list"></div>
    <hr class="settings-divider" />
    <button id="cache-bust-btn" class="settings-item">🗑 Vider le cache</button>
  </div>

  <!-- Bottom-right legend -->
  <div id="legend">
    <div class="legend-title" id="legend-toggle">Opérateurs <span class="legend-chevron">▾</span></div>
    <div id="legend-items"></div>
    <div class="legend-hint">Taille du cercle = nb bornes CCS rapides</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
